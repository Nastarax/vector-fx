# USOIL (WTI crude) scoring. Standalone instrument: NOT base-minus-quote.
# Score = weighted mean of the `signal` rows' scores, rounded half away from
# zero, clamped to -2..+2. A signal with no data (e.g. the curve on an old
# backtest date) is left OUT of the mean and shown as "-", not counted as 0.
#
# Roles:
#   signal   - scored -2..+2 and summed into the composite (weight applies)
#   display  - shown with its reading, never scored or summed
#   regime   - (later phases) shown, not summed until its effect is defined
#
# Signal types (each maps to a scorer in src/scoring/score_oil.py):
#   eia_stocks   - level vs 5y same-week avg + 4w change (inventory; low/drawing = bullish)
#   curve        - (M1 - M12) / M1 in %; backwardation = bullish
#   cot          - CFTC disaggregated managed-money Long% week-over-week change,
#                  scored exactly like the FX COT cell (score_sentiment.cot_score)
#   trend        - existing trend_score on the daily chart (SMA3/14, same as metals)
#   eia_display  - display-only EIA series (latest value + 4w context)
#   rig_count    - Baker Hughes US oil rigs, 4w + 13w % change (falling = bullish)
#
#   steo_spare   - EIA STEO OPEC spare capacity: level + revision vs last month's STEO
#   steo_nonopec - EIA STEO non-OPEC supply: next-12m forecast revision vs last month's STEO
#   china_pmi    - China NBS manufacturing PMI, actual vs forecast (Caixin shown alongside)
#   opec_flag    - latest manual entry in opec_decisions below
# Regime rows are SHOWN with a lean (-2..+2) but never counted in the score.

instrument:
  symbol: USOIL           # broker CFD label shown on the heatmap
  yf_ticker: "CL=F"       # all price data (trend, location, curve front fallback)
  display_name: USOIL

# Composite score (-2..+2) -> bias label.
bias_labels:
  "2": Very Bullish
  "1": Bullish
  "0": Neutral
  "-1": Bearish
  "-2": Very Bearish

# EIA Weekly Petroleum Status Report: data is for the week ending Friday,
# released the following Wednesday 10:30 ET (Thursday when a US federal
# holiday falls Mon-Wed of release week). Backtests only see a print once
# as_of >= its release date.
eia:
  release_lag_days: 5
  seasonal_years: 5       # 5-year same-week average

# CFTC COT: positions as of Tuesday, released Friday 3:30 ET (Monday after a
# holiday week). Backtests only see a report once as_of >= its release date.
cot:
  contract_code: "067651" # NYMEX WTI Light Sweet ("WTI-PHYSICAL"), disaggregated report
  release_lag_days: 3

signals:
  - id: crude_stocks
    label: Crude Stocks
    role: signal
    type: eia_stocks
    series: WCESTUS1                  # U.S. ending stocks excl. SPR, kbbl
    weight: 1.0
    level_pct: 3.0                    # |level vs 5y same-week avg| beyond this % -> +-1
    change_pct: 0.75                  # |4w change vs 5y avg 4w change| beyond this % of 5y level -> +-1
    change_vs_seasonal: true          # false = raw 4w change (reads seasonal draws as signal)

  - id: cushing_stocks
    label: Cushing Stocks
    role: signal
    type: eia_stocks
    series: W_EPC0_SAX_YCUOK_MBBL     # Cushing, OK ending stocks excl. SPR, kbbl
    weight: 1.0
    level_pct: 10.0
    change_pct: 4.0
    change_vs_seasonal: true

  - id: curve
    label: Curve M1-M12
    role: signal
    type: curve
    weight: 1.0
    weak_pct: 2.0                     # |spread| beyond this % -> +-1
    strong_pct: 6.0                   # |spread| beyond this % -> +-2

  - id: cot
    label: COT (Managed Money)
    role: signal
    type: cot
    weight: 1.0
    neutral_threshold: 0.0            # pp of Long%; 0 = strict sign, same as FX

  - id: trend
    label: Trend
    role: signal
    type: trend
    weight: 1.0

  # Baker Hughes US oil rotary rigs. Released Friday 1pm ET (earlier before
  # holidays); the cache is keyed by publish date, so backtests see a print
  # only once released. Supply read: fewer rigs -> less future output ->
  # bullish. NB rigs lag price by ~3-4 months, so this often fights the trend
  # row; flip `direction` to up_is_bullish to read it as a demand/momentum
  # confirmation instead. Thresholds ~ interquartile range of 2023-2026 moves.
  - id: rigs
    label: Oil Rigs (Baker Hughes)
    role: signal
    type: rig_count
    field: oil                        # oil | gas | total (US)
    direction: down_is_bullish
    weight: 1.0
    short_weeks: 4
    short_pct: 1.5                    # |4w % change| beyond this -> +-1
    long_weeks: 13
    long_pct: 4.0                     # |13w % change| beyond this -> +-1

  # ---- Regime rows (phase 3): context, shown with a lean, not summed ----
  # EIA STEO vintages (src/fetchers/steo.py): every monthly release since 2015,
  # each with its own release date, so backtests see a vintage only once out.
  # Revisions compare the next-12-month average in this STEO vs the previous
  # month's STEO over the same months (consecutive vintages only: OPEC
  # membership changes shift the series between distant vintages).
  - id: opec_spare
    label: OPEC Spare Capacity
    role: regime
    type: steo_spare
    series: cops_opec                 # mb/d
    tight_mbd: 1.5                    # current-month spare <= this -> +1 (tight, bullish risk)
    loose_mbd: 4.0                    # >= this -> -1 (ample cushion)
    rev_mbd: 0.2                      # next-12m avg revised down by >= this -> +1, up -> -1

  - id: nonopec_supply
    label: Non-OPEC Supply (STEO)
    role: regime
    type: steo_nonopec
    series: papr_nonopec              # mb/d, total non-OPEC liquids
    weak_mbd: 0.2                     # next-12m avg revised up by >= this -> -1 (more supply)
    strong_mbd: 0.5                   # >= this -> -2; downward revisions mirror to +1/+2

  # China official NBS manufacturing PMI (Investing id 594; Caixin id 753 shown
  # alongside). Refreshed from the laptop (Cloudflare), target china_pmi.
  - id: china_pmi
    label: China mPMI
    role: regime
    type: china_pmi

  - id: opec_flag
    label: OPEC+ Decision
    role: regime
    type: opec_flag

  - id: production
    label: US Production
    role: display
    type: eia_display
    series: WCRFPUS2                  # U.S. field production of crude, kb/d

  - id: product_supplied
    label: Product Supplied
    role: display
    type: eia_display
    series: WRPUPUS2                  # U.S. product supplied, total petroleum products, kb/d

# OPEC+ decisions, entered by hand (no reliable free feed). The newest entry on
# or before the scoring date is shown on the OPEC+ Decision row.
#   decision: cut (lower output targets / extend cuts) -> +1
#             hike (raise output targets / unwind cuts) -> -1
#             hold -> 0
# Example:
#   - {date: "2026-11-30", decision: hold, note: "Q1 targets unchanged"}
opec_decisions: []
